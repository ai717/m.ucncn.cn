<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c822"/>
      <stop offset="100%" stop-color="#008a16"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角底色 -->
  <rect width="64" height="64" rx="16" fill="#0d1a12"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1b3824" stroke-width="2"/>
  
  <!-- 胶片孔边缘装饰 (左侧与右侧) -->
  <rect x="6" y="10" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="6" y="22" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="6" y="34" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="6" y="46" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="54" y="10" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="54" y="22" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="54" y="34" width="4" height="6" rx="1.5" fill="#1b3824"/>
  <rect x="54" y="46" width="4" height="6" rx="1.5" fill="#1b3824"/>

  <!-- 核心放映机镜头与豆瓣笑脸双螺旋隐喻 -->
  <circle cx="32" cy="28" r="14" fill="url(#dbGreen)"/>
  <circle cx="32" cy="28" r="11" fill="#0d1a12"/>
  <circle cx="32" cy="28" r="6" fill="url(#goldGlow)"/>
  
  <!-- 豆瓣经典微笑弧度 -->
  <path d="M 22 44 Q 32 54 42 44" fill="none" stroke="url(#dbGreen)" stroke-width="4" stroke-linecap="round"/>
</svg>
