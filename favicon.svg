<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Precision Color Definitions & Filter System -->
  <defs>
    <!-- Deep Obsidian Carbon Base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#06080d" />
      <stop offset="100%" stop-color="#0e131d" />
    </linearGradient>

    <!-- Jewel Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ascendant Exponential Cashflow Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Sovereign Gold Beacon Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Top Specular Glass Sheen -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Luminous Neon Ambient Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Spark Glow -->
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Precision Obsidian Beveled Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- 2. Glass Specular Highlight Arc -->
  <path d="M8 34C8 19.64 19.64 8 34 8h60c14.36 0 26 11.64 26 26v10C120 44 98 52 64 52S8 44 8 44V34z" fill="url(#specularGrad)" />

  <!-- 3. Micro Architectural Geometry (Technical Grid) -->
  <line x1="8" y1="64" x2="120" y2="64" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
  <line x1="64" y1="8" x2="64" y2="120" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
  <circle cx="64" cy="64" r="38" stroke="rgba(16,185,129,0.06)" stroke-width="1" fill="none" />

  <!-- 4. Subtle Sovereign Currency Spine ($) Passing Through Center -->
  <path d="M64 22v84" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.4" />

  <!-- 5. Secondary Growth Shadow (Creates Visual Depth) -->
  <path 
    d="M44 88V64l12 12 8-10 24-20" 
    stroke="url(#mGrad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.25"
  />

  <!-- 6. Core M-Monogram: Ascendant Compounding Cashflow Curve -->
  <path 
    d="M32 88V44l22 26 10-12 32-26" 
    stroke="url(#mGrad)" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- 7. Apex High-Yield Monetization Beacon (Radiant Golden Spark) -->
  <g filter="url(#sparkGlow)">
    <!-- 4-Point Radiant Diamond Spark -->
    <path d="M96 22l2.5 8 8 2.5-8 2.5-2.5 8-2.5-8-8-2.5 8-2.5z" fill="url(#goldGrad)" />
    <!-- Core Bright Focus Particle -->
    <circle cx="96" cy="32.5" r="4.5" fill="url(#goldGrad)" />
    <circle cx="96" cy="32.5" r="2" fill="#ffffff" />
  </g>

  <!-- 8. Tactile Pivot Anchors -->
  <circle cx="32" cy="88" r="4.5" fill="#06b6d4" />
  <circle cx="32" cy="44" r="4.5" fill="#10b981" />
  <circle cx="54" cy="70" r="3.5" fill="#34d399" />
</svg>
